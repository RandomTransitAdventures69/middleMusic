name: Cross-platform releases

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[client]" pyinstaller build
      - name: Build server and desktop client
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --name middleMusicServer --collect-data middlemusic --collect-all imageio_ffmpeg server_launcher.py
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name middleMusicClient --collect-all PySide6 --collect-all imageio_ffmpeg client_launcher.py
      - name: Build Python distributions
        run: python -m build
      - name: Bundle release files
        run: |
          python -c "import pathlib, shutil; out=pathlib.Path('release-assets'); out.mkdir(exist_ok=True); [shutil.copy2(p, out / p.name) for p in pathlib.Path('dist').glob('middleMusicServer*') if p.is_file()]; [shutil.copy2(p, out / p.name) for p in pathlib.Path('dist').glob('middleMusicClient*') if p.is_file()]; [shutil.copy2(p, out / p.name) for p in pathlib.Path('dist').glob('*.whl')]; [shutil.copy2(p, out / p.name) for p in pathlib.Path('dist').glob('*.tar.gz')]"
      - uses: actions/upload-artifact@v4
        with:
          name: middlemusic-${{ runner.os }}
          path: release-assets/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
